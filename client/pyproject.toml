[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kru-robot"
version = "0.1.0"
description = "Десктоп-оболонка агента Kru: анімований персонаж поверх усіх вікон"
requires-python = ">=3.10"
# vosk — ім'я «Кру» офлайн; numpy + onnxruntime — своя фраза-активатор («Чуєш, Кру», wakeword.py)
dependencies = ["PySide6>=6.6", "vosk>=0.3.45", "numpy", "onnxruntime"]

[project.gui-scripts]
kru-robot = "kru_robot.app:main"

[tool.setuptools.packages.find]
include = ["kru_robot*"]
