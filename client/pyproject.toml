[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kru-robot"
version = "0.1.0"
description = "Десктоп-оболонка агента Kru: анімований персонаж поверх усіх вікон"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "vosk>=0.3.45"]  # vosk — розпізнавання імені «Кру» (офлайн)

[project.gui-scripts]
kru-robot = "kru_robot.app:main"

[tool.setuptools.packages.find]
include = ["kru_robot*"]
