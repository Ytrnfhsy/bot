[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kru-robot"
version = "0.1.0"
description = "Десктоп-оболонка агента Kru: анімований персонаж поверх усіх вікон"
requires-python = ">=3.10"
# numpy + onnxruntime — фраза-активатор «Чуєш, Кру» (wakeword.py).
# Для найновіших Python onnxruntime виходить із запізненням — тоді робот ставиться без нього (режим «Кру» підкаже)
dependencies = ["PySide6>=6.6", "numpy; python_version < '3.15'",
                "onnxruntime; python_version < '3.15'"]

[project.gui-scripts]
kru-robot = "kru_robot.app:main"

[tool.setuptools.packages.find]
include = ["kru_robot*"]
