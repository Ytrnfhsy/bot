[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-agent"
version = "0.1.0"
description = "Kru — автономний агент на Qwen3.6 (llama-server) з інструментами, пам'яттю та WebSocket API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "pypdf>=4.0",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kru = "bonsai_agent.cli:main"
bonsai = "bonsai_agent.cli:main"  # стара назва команди — для вже встановлених систем

[tool.setuptools.packages.find]
include = ["bonsai_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
